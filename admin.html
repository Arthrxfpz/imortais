<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Imortais</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0d1110;--ink:#f1f5f3;--muted:#98a39e;--line:#1b221f;--accent:#34d27b;--accent-soft:#0e2a1b;--bad:#ff8a80;--f:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--f);color-scheme:dark;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:36px 20px 80px}
h1{font:800 1.7rem var(--f);letter-spacing:-.03em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
input{width:100%;background:#000;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:13px 16px;font:inherit}
input:focus{outline:2px solid var(--accent);border-color:transparent}
label{display:block;font-size:.82rem;font-weight:600;margin:0 0 8px}
.btn{background:var(--accent);color:#000;border:0;border-radius:12px;padding:12px 18px;font:700 .95rem var(--f);cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.g:hover{border-color:#2b6b4a}
.err{color:var(--bad);font-size:.9rem;margin-top:12px;min-height:1.2em}
#login{max-width:400px;margin:12vh auto 0}
#login .card>*+*{margin-top:16px}
.ok{background:var(--accent-soft);border:1px solid #1d4a31;color:var(--accent);border-radius:14px;padding:12px 18px;font-weight:600;font-size:.92rem;margin-bottom:22px;transition:opacity .5s}
.ok.off{opacity:0;height:0;padding:0;margin:0;border:0;overflow:hidden}
.sub{color:var(--muted);font-size:.95rem}
.btn.gg{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1f1f1f;padding:14px}
.btn.gg:disabled{opacity:.5;cursor:not-allowed}
#painel{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.stat strong{display:block;font:800 2rem/1 var(--f);color:var(--accent)}
.stat span{color:var(--muted);font-size:.85rem}
.tools{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:none;color:var(--muted);border-radius:99px;padding:7px 16px;font:600 .88rem var(--f);cursor:pointer}
.tab.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .n{flex:1;font-weight:600;word-break:break-word}
.row small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
.badge{font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:99px}
.badge.sim{background:var(--accent-soft);color:var(--accent)}
.badge.nao{background:#1f1010;color:var(--bad)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:6px 10px;border-radius:8px}
.del:hover{color:var(--bad)}
.vazio{color:var(--muted);text-align:center;padding:30px 0}
@media(max-width:520px){.stats{gap:8px}.stat{padding:14px 6px}}
</style>
</head>
<body>
<div class="wrap">

<div id="login">
  <div class="card">
    <h1>Painel administrador</h1>
    <button class="btn gg" id="google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.600-5.900c-2.100 1.400-4.900 2.300-8.300 2.300-6.300 0-11.600-4-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>
      Entrar com o Google
    </button>
    <div class="err" id="lerr" role="alert"></div>
  </div>
</div>

<div id="painel">
  <div class="ok" id="ok" role="status">Conta Google autorizada com sucesso</div>
  <div class="top">
    <h1>Respostas · Imortais</h1>
    <div style="display:flex;gap:8px"><button class="btn g" id="csv">Baixar CSV</button><button class="btn g" id="out">Sair</button></div>
  </div>
  <div class="stats">
    <div class="stat"><strong id="t">0</strong><span>respostas</span></div>
    <div class="stat"><strong id="s">0</strong><span>vão participar</span></div>
    <div class="stat"><strong id="nn">0</strong><span>não vão</span></div>
  </div>
  <div class="tools"><input id="q" type="search" placeholder="Buscar por nome ou turma" aria-label="Buscar por nome ou turma"></div>
  <div class="tabs">
    <button class="tab on" data-f="todos">Todos</button>
    <button class="tab" data-f="sim">Vão participar</button>
    <button class="tab" data-f="nao">Não vão</button>
  </div>
  <div class="card" id="lista"></div>
  <div class="err" id="perr"></div>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=i=>document.getElementById(i);
let dados=[],filtro="todos",unsub=null;
if(firebaseConfig.apiKey==="COLE_AQUI"){
  $("lerr").textContent="Configure o arquivo firebase-config.js primeiro.";
  $("google").disabled=true;
}else{
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(),db=firebase.firestore();

  const ADMINS=["zarthur063@gmail.com","laurarneves73@gmail.com"];
  $("google").onclick=async()=>{
    $("lerr").textContent="";
    try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
    catch(x){
      if(x.code!=="auth/popup-closed-by-user"&&x.code!=="auth/cancelled-popup-request")
        $("lerr").textContent=x.code==="auth/unauthorized-domain"?"Este endereço não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados).":"Não foi possível entrar com o Google. Tente de novo.";
    }
  };
  $("out").onclick=()=>auth.signOut();

  auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(u&&!ADMINS.includes((u.email||"").toLowerCase())){
      $("lerr").textContent="Esta conta ("+u.email+") não tem acesso.";
      auth.signOut();return;
    }
    $("login").style.display=u?"none":"block";
    if(u){const o=$("ok");o.classList.remove("off");setTimeout(()=>o.classList.add("off"),4000)}
    $("painel").style.display=u?"block":"none";
    if(!u)return;
    unsub=db.collection("respostas").orderBy("criadoEm","desc").onSnapshot(snap=>{
      $("perr").textContent="";
      dados=snap.docs.map(d=>({id:d.id,...d.data()}));
      render();
    },err=>{$("perr").textContent="Sem permissão para ler. Confira se as regras do Firestore foram publicadas."});
  });

  $("lista").addEventListener("click",async e=>{
    const b=e.target.closest(".del");if(!b)return;
    if(confirm("Apagar esta resposta?"))db.collection("respostas").doc(b.dataset.id).delete();
  });
}

function data(r){const t=r.criadoEm&&r.criadoEm.toDate?r.criadoEm.toDate():null;return t?t.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"agora"}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const sim=dados.filter(r=>r.participa==="sim").length;
  $("t").textContent=dados.length;$("s").textContent=sim;$("nn").textContent=dados.length-sim;
  const l=dados.filter(r=>(filtro==="todos"||r.participa===filtro)&&(r.nome.toLowerCase().includes(q)||(r.turma||"").toLowerCase().includes(q)));
  const box=$("lista");box.innerHTML="";
  if(!l.length){box.innerHTML='<div class="vazio">Nenhuma resposta por aqui.</div>';return}
  l.forEach(r=>{
    const row=document.createElement("div");row.className="row";
    const n=document.createElement("div");n.className="n";n.textContent=r.nome;
    const sm=document.createElement("small");sm.textContent=data(r)+" · "+(r.estudante==="sim"?"Estudante, turma "+(r.turma||"?"):r.estudante==="nao"?"Não é estudante":"");n.appendChild(sm);
    const bd=document.createElement("span");bd.className="badge "+r.participa;bd.textContent=r.participa==="sim"?"Vai participar":"Não vai";
    const d=document.createElement("button");d.className="del";d.dataset.id=r.id;d.title="Apagar";d.setAttribute("aria-label","Apagar resposta");d.textContent="✕";
    row.append(n,bd,d);box.appendChild(row);
  });
}
$("q").oninput=render;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");filtro=b.dataset.f;render();
});
$("csv").onclick=()=>{
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const linhas=[["Nome","Participa","Estudante","Turma","Data"].map(esc).join(",")].concat(dados.map(r=>[r.nome,r.participa==="sim"?"Sim":"Não",r.estudante==="sim"?"Sim":"Não",r.turma||"",data(r)].map(esc).join(",")));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+linhas.join("\n")],{type:"text/csv;charset=utf-8"}));
  a.download="respostas-imortais.csv";a.click();
};
</script>
</body>
</html>
